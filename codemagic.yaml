workflows:
  # ---------------------------------------------------------------------------
  # Builds an unsigned .app for the iOS Simulator. No Apple Developer account
  # needed. Use this first to confirm the project builds correctly, and to
  # preview it in Appetize.io or download + run in Xcode's own simulator.
  # ---------------------------------------------------------------------------
  ios-simulator:
    name: iOS Simulator Build (no signing required)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Build for iOS Simulator
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath DerivedData build \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/DerivedData/Build/Products/Debug-iphonesimulator/*.app

  # ---------------------------------------------------------------------------
  # Builds a signed .ipa for App Store submission / TestFlight.
  # Requires the CLIENT's Apple Developer Program account and one-time setup
  # in the Codemagic dashboard:
  #   1. Client generates an App Store Connect API key (App Store Connect >
  #      Users and Access > Integrations > App Store Connect API > Team Keys
  #      > Generate API Key, role "App Manager" or "Admin"). This gives you
  #      the Issuer ID, Key ID, and a downloadable .p8 private key file
  #      WITHOUT sharing their Apple ID password.
  #   2. In Codemagic: Team settings > Integrations > App Store Connect >
  #      add the key there, name it "codemagic_api_key" (matches the
  #      `integrations` reference below).
  #   3. In App Store Connect, the client creates the app record itself:
  #      My Apps > + > New App, bundle ID com.theeipay.app, matching name
  #      "Thee iPay". This must exist before the publish step below works.
  # Until that's done, only the ios-simulator workflow will succeed.
  # ---------------------------------------------------------------------------
  ios-signed:
    name: iOS Signed Build (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.theeipay.app
      node: 22
      vars:
        XCODE_WORKSPACE: "App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$(cd ios/App && xcodebuild -showBuildSettings -project App.xcodeproj -scheme App | awk -F' = ' '/PRODUCT_BUNDLE_IDENTIFIER/{print $2; exit}')" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build ipa
        script: |
          cd ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - webmaster@superior.edu.pk
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Flip this to true once the App Store Connect listing (screenshots,
        # description, privacy info, age rating) is filled in and you're
        # ready to send it to Apple for review.
        submit_to_app_store: false
