workflows:
  # ---------------------------------------------------------------------------
  # Builds an unsigned .app for the iOS Simulator. No Apple Developer account
  # needed. Use this first to confirm the project builds correctly, and to
  # preview it in Appetize.io or download + run in Xcode's own simulator.
  # ---------------------------------------------------------------------------
  ios-simulator:
    name: iOS Simulator Build (no signing required)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Build for iOS Simulator
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath DerivedData build \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/DerivedData/Build/Products/Debug-iphonesimulator/*.app

  # ---------------------------------------------------------------------------
  # Builds a signed .ipa for real devices (ad-hoc) or TestFlight/App Store.
  # Requires an Apple Developer Program account ($99/yr) and one-time setup
  # in the Codemagic dashboard:
  #   1. App settings > Code signing identities > iOS code signing
  #      -> connect your Apple Developer account (automatic signing), or
  #         upload a distribution certificate + provisioning profile manually.
  #   2. App settings > Environment variables > add group "app_store_credentials"
  #      with APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER,
  #      APP_STORE_CONNECT_PRIVATE_KEY (from App Store Connect > Users and
  #      Access > Keys) if you want automatic signing / TestFlight upload.
  # Until that's set up, only the ios-simulator workflow above will succeed.
  # ---------------------------------------------------------------------------
  ios-signed:
    name: iOS Signed Build (device / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.theeipay.app
      groups:
        - app_store_credentials
      node: 22
      vars:
        XCODE_WORKSPACE: "App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$(cd ios/App && xcodebuild -showBuildSettings -project App.xcodeproj -scheme App | awk -F' = ' '/PRODUCT_BUNDLE_IDENTIFIER/{print $2; exit}')" \
            --type IOS_APP_ADHOC --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build ipa
        script: |
          cd ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - webmaster@superior.edu.pk
        notify:
          success: true
          failure: true
